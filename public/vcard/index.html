       where relative "assets/..." would resolve to /assets/... and break. -->

  <style>
    :root {
      --ground: #0a0a0a;
      --surface: #161616;      /* one tone step above the ground, no borders */
      --surface-hover: #1f1f1f;
      --ink: #f2efe6;          /* the warm white of the logo's wordmark */
      --muted: #a39e92;
      --gold: #d4af37;
      --gold-press: #bf9b2f;
      --on-gold: #0a0a0a;
      --network: #222222;

      --font: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font-family: var(--font);
      font-weight: 500;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent; }
    svg { display: block; fill: currentColor; }

    /* The network motif from the printed card, top-right, running off the edge. */
    .network {
      position: fixed;
      top: -24px;
      right: -40px;
      width: min(340px, 78vw);
      height: auto;
      color: var(--network);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: max(56px, env(safe-area-inset-top)) 24px max(40px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .logo {
      display: block;
      width: min(300px, 78vw);
      height: auto;
      margin: 0 auto 48px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 36px);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .role {
      margin: 12px 0 0;
      font-size: 18px;
      color: var(--muted);
    }

    .save {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 60px;
      margin-top: 40px;
      padding: 0 24px;
      border-radius: 999px;
      background: var(--gold);
      color: var(--on-gold);
      font-size: 18px;
      font-weight: 600;
      transition: background-color 160ms ease, transform 160ms var(--ease-out);
    }
    .save svg { width: 24px; height: 24px; }
    .save:hover { background: #dcba4a; }
    .save:active { background: var(--gold-press); transform: scale(0.98); }
    .save-note {
      margin: 14px 0 0;
      font-size: 14px;
      color: var(--muted);
    }

    .links {
      list-style: none;
      margin: 48px 0 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .links a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
      border-radius: 16px;
      font-size: 13px;
      color: var(--muted);
      transition: color 160ms ease;
    }
    .links .disc {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--surface);
      color: var(--ink);
      transition: background-color 160ms ease, color 160ms ease, transform 160ms var(--ease-out);
    }
    .links .disc svg { width: 22px; height: 22px; }
    .links a:hover { color: var(--ink); }
    .links a:hover .disc { background: var(--surface-hover); color: var(--gold); }
    .links a:active .disc { transform: scale(0.94); }

    .save:focus-visible,
    .links a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    .foot {
      margin: 56px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    /* Entrance: heading, then text, then actions, staggered. CSS only, so content
       is never stuck hidden if a script fails; skipped entirely for reduced motion. */
    @media (prefers-reduced-motion: no-preference) {
      .rise {
        animation: rise 640ms var(--ease-out) both;
        animation-delay: calc(var(--i, 0) * 80ms);
      }
      .network { animation: drift 1400ms var(--ease-out) both; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes drift {
      from { opacity: 0; transform: translate(24px, -12px); }
      to   { opacity: 1; transform: none; }
    }

    @media (min-width: 768px) {
      .logo { width: 360px; margin-bottom: 56px; }
      .card { max-width: 640px; }
      h1 { font-size: 46px; }
      .role { font-size: 20px; }
      .save, .save-note, .links { width: 100%; max-width: 420px; margin-left: auto; margin-right: auto; }
      .network { width: 480px; }
    }
  </style>
</head>

    // opening the "Create New Contact" sheet. Dropping the attribute there lets iOS
    // read the text/vcard file directly; every other platform keeps the download.

      var ua = navigator.userAgent;
      var iOS = /iPad|iPhone|iPod/.test(ua) || (ua.includes("Macintosh") && navigator.maxTouchPoints > 1);
